name: Security Scan
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: "0 3 * * 1" }]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install bandit pip-audit
      - run: bandit -c pyproject.toml -r src api -q
      - run: pip install -r requirements.txt && pip-audit || true
