name: CI
on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main, develop] }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python-version: ["3.10", "3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: ruff check src api cli tests
      - run: mypy src api cli --ignore-missing-imports
      - run: bandit -c pyproject.toml -r src api -q
      - run: pip-audit || true
      - env:
          OPENAI_API_KEY: sk-test-key-for-ci
          JWT_SECRET: test-jwt-secret-for-ci-please-change-me-123
          ADMIN_API_KEY: test-admin-key
          API_KEYS: test-api-key-1
          CACHE_ENCRYPT: "false"
        run: pytest --cov=src --cov=api --cov-report=xml --cov-report=term-missing
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with: { files: ./coverage.xml, fail_ci_if_error: false }
