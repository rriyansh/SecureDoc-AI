[project]
name = "securedoc-ai"
version = "2.0.0"
description = "Hardened Enterprise RAG with Guardrails, Hybrid Search, Auth, Caching, and Metrics"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SecureDoc AI Team" }]

dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0.0",
    "nemoguardrails>=0.10.0",
    "ragas>=0.2.0",
    "datasets>=3.0.0",
    "tiktoken>=0.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "loguru>=0.7.2",
    "tenacity>=9.0.0",
    "prometheus-client>=0.20.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "bandit>=1.7.9",
    "pip-audit>=2.7.3",
]

[project.scripts]
securedoc = "cli.main:main"

[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "api*", "cli*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "C4", "SIM", "S", "SEC"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src --cov=api --cov-report=term-missing"

[tool.coverage.run]
source = ["src", "api"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
